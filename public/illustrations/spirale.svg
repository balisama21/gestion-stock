<svg xmlns="http://www.w3.org/2000/svg" width="44" height="18" viewBox="0 0 44 18">
  <!-- Une spire de la reliure d'un bloc-notes, vue de dessus : les deux
       trous percés de part et d'autre du pli, le fil d'acier qui passe de
       l'un à l'autre, et son ombre sur le papier. Répétée de haut en bas. -->
  <defs>
    <linearGradient id="acier" x1="0" y1="3" x2="0" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#434b53"/>
      <stop offset="0.3" stop-color="#f6f8fa"/>
      <stop offset="0.55" stop-color="#b9c0c7"/>
      <stop offset="0.8" stop-color="#7b848d"/>
      <stop offset="1" stop-color="#4c555e"/>
    </linearGradient>
    <radialGradient id="trou" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#1d2226"/>
      <stop offset="0.75" stop-color="#3a4147"/>
      <stop offset="1" stop-color="#8b939a"/>
    </radialGradient>
    <filter id="flou" x="-20%" y="-40%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <ellipse cx="6.5" cy="12.2" rx="3.3" ry="2.7" fill="url(#trou)"/>
  <ellipse cx="37.5" cy="12.2" rx="3.3" ry="2.7" fill="url(#trou)"/>
  <path d="M7 13.5C6.5 4 37.5 3.5 37 13" fill="none" stroke="#000" stroke-opacity="0.32"
    stroke-width="3.4" filter="url(#flou)" transform="translate(1.2 2.2)"/>
  <path d="M7 13C6.5 3.6 37.5 3.1 37 12.6" fill="none" stroke="url(#acier)" stroke-width="3"
    stroke-linecap="round"/>
  <path d="M8.6 9.4C11 5.6 33 5.4 35.6 9" fill="none" stroke="#fff" stroke-opacity="0.55"
    stroke-width="0.7" stroke-linecap="round"/>
</svg>
